identity:
  name: exa_contents
  author: yevanchen
  label:
    en_US: Exa URL Contents
    zh_Hans: Exa URL 内容获取
    pt_BR: Conteúdo Exa URL
    ja_JP: Exa URL コンテンツ
description:
  human:
    en_US: Retrieve the text content from specific URLs using Exa's web content extraction capabilities.
    zh_Hans: 使用 Exa 的网页内容提取功能获取特定 URL 的文本内容。
    pt_BR: Recupere o conteúdo de texto de URLs específicas usando as capacidades de extração de conteúdo web da Exa.
    ja_JP: Exaのウェブコンテンツ抽出機能を使用して、特定のURLからテキストコンテンツを取得します。
  llm: A tool for retrieving the full text content from specific web pages or documents using Exa's content extraction API.
parameters:
  - name: urls
    type: string
    required: true
    label:
      en_US: URLs
      zh_Hans: URL列表
      pt_BR: URLs
      ja_JP: URL
    human_description:
      en_US: Comma-separated list of URLs to fetch content from.
      zh_Hans: 用逗号分隔的URL列表，用于获取内容。
      pt_BR: Lista de URLs separadas por vírgulas para buscar conteúdo.
      ja_JP: コンテンツを取得するためのカンマ区切りのURLリスト。
    llm_description: A list of URLs to extract content from, separated by commas.
    form: llm

  - name: max_age_hours
    type: number
    required: false
    label:
      en_US: Max Age (Hours)
      zh_Hans: 最大缓存时间（小时）
      pt_BR: Idade Máxima (Horas)
      ja_JP: 最大キャッシュ時間（時間）
    human_description:
      en_US: Freshness control. 0 = always crawl, -1 = cache only, 24 = cache if less than 24h old.
      zh_Hans: 新鲜度控制。0 = 总是爬取，-1 = 仅缓存，24 = 如果缓存不到24小时则使用缓存。
      pt_BR: Controle de frescor. 0 = sempre rastrear, -1 = apenas cache, 24 = cache se menos de 24h.
      ja_JP: 鮮度制御。0 = 常にクロール、-1 = キャッシュのみ、24 = 24時間以内ならキャッシュ使用。
    llm_description: Controls content freshness. 0 = always crawl, -1 = cache only, positive number = cache if younger than N hours.
    form: form

  - name: include_highlights
    type: boolean
    required: false
    default: true
    label:
      en_US: Include Highlights
      zh_Hans: 包含高亮摘要
      pt_BR: Incluir Destaques
      ja_JP: ハイライトを含める
    human_description:
      en_US: Return query-relevant excerpts from each page. Recommended for most use cases.
      zh_Hans: 返回每个页面中与查询相关的摘要。适用于大多数场景。
      pt_BR: Retorna trechos relevantes de cada página. Recomendado para a maioria dos casos.
      ja_JP: 各ページからクエリに関連する抜粋を返します。ほとんどのケースで推奨。
    llm_description: Return query-relevant excerpts from each page.
    form: form

  - name: highlights_max_characters
    type: number
    required: false
    label:
      en_US: Highlights Max Characters
      zh_Hans: 高亮最大字符数
      pt_BR: Máx. Caracteres de Destaques
      ja_JP: ハイライト最大文字数
    human_description:
      en_US: Maximum number of characters per highlight excerpt.
      zh_Hans: 每段高亮摘要的最大字符数。
      pt_BR: Número máximo de caracteres por trecho destacado.
      ja_JP: ハイライト抜粋ごとの最大文字数。
    llm_description: Maximum number of characters per highlight excerpt.
    form: form

  - name: full_page_text
    type: boolean
    required: false
    default: false
    label:
      en_US: Full Page Text
      zh_Hans: 完整页面文本
      pt_BR: Texto Completo da Página
      ja_JP: 完全ページテキスト
    human_description:
      en_US: Return full webpage text. Opt-in; uses more tokens.
      zh_Hans: 返回完整网页文本。选择启用；使用更多 token。
      pt_BR: Retorna o texto completo da página. Opt-in; usa mais tokens.
      ja_JP: 完全なウェブページテキストを返します。オプトイン；トークンをより多く使用。
    llm_description: Return the full page text. Opt-in and uses more tokens than highlights.
    form: form

  - name: number_of_subpages
    type: number
    required: false
    default: 1
    label:
      en_US: Number of Subpages
      zh_Hans: 子页面数量
      pt_BR: Número de Subpáginas
      ja_JP: サブページ数
    human_description:
      en_US: Number of subpages to include within each result.
      zh_Hans: 每个结果中要包括的子页面数量。
      pt_BR: Número de subpáginas a incluir dentro de cada resultado.
      ja_JP: 各結果中に含めるサブページの数。
    llm_description: Specify the number of subpages to include in the content extraction.
    form: form

  - name: return_links
    type: number
    required: false
    default: 1
    label:
      en_US: Return Links
      zh_Hans: 返回链接
      pt_BR: Retornar Links
      ja_JP: リンクを返す
    human_description:
      en_US: Number of links to return from each webpage.
      zh_Hans: 从每个网页返回的链接数量。
      pt_BR: Número de links a retornar de cada página web.
      ja_JP: 各ウェブページから返すリンクの数。
    llm_description: Include links found on each webpage.
    form: form

extra:
  python:
    source: tools/exa_contents.py
